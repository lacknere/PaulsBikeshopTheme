name: Code Style

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  cs:
    name: Code Format
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run CS
        uses: shopware/github-actions/extension-verifier@main
        with:
          action: format

  ludtwig:
    name: Twig Lint (Storefront)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install ludtwig
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.14.0 --repo MalteJanz/ludtwig --pattern '*unknown-linux-gnu.tar.gz' && tar xf *.tar.gz
          mv ./ludtwig /usr/local/bin

      - name: Run ludtwig linter
        run: |
          cd ./src/Resources/views
          ludtwig .

  check:
    name: Extension Validation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Check
        uses: shopware/github-actions/extension-verifier@main
        with:
          action: check
